name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: ["main"] # Triggers deployment whenever you push to main

  # Allows you to manually trigger the deployment from the Actions tab
  workflow_dispatch:

# REQUIRED: Grants the workflow permissions to publish to Pages & mint OIDC tokens
permissions:
  contents: read
  pages: write
  id-token: write

# REQUIRED: Prevents concurrent deployment loops from hanging the action
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # Uploads the root directory containing your index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
